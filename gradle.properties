# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 1.5 GB heap cap + aggressive GC so unused RAM is returned to the OS promptly
# on low-RAM hosts. preferIPv4Stack + the socket timeout kill the Gradle
# "Did not receive connection preamble within 10s" daemon handshake failures.
org.gradle.jvmargs=-Xmx1536m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dorg.gradle.internal.socket.connection.timeout=60000
# Cache Gradle's configuration phase so subsequent invocations skip the model
# build. Cuts noop incremental builds from ~5s → ~1s. Safe with AGP 8.7+.
org.gradle.configuration-cache=true
# Serial execution with a capped worker pool: parallel JVM workers exhaust RAM
# on low-memory build hosts, so keep the build single-threaded and bounded.
org.gradle.parallel=false
org.gradle.workers.max=2
# Cache task outputs across builds (also re-uses outputs from `clean` rebuilds
# of the same content). Pairs well with configuration cache.
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Compile Kotlin in-process to avoid a second Kotlin daemon JVM (~1.5 GB).
kotlin.compiler.execution.strategy=in-process
podsteroidQemuVersion=11.0.2
podsteroidKernelVersion=7.1.5
