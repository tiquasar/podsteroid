name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Match the NDK the terminal-emulator JNI is built against. If the build
      # complains about a missing NDK version, align this with AGP's default.
      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
